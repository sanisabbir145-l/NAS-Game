<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAS Games</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --border: #2a2a38;
      --text: #ffffff;
      --muted: #9ca3af;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 74px; }

    /* Top Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .brand-area { display: flex; align-items: center; gap: 8px; }
    .logo { width: 34px; height: 34px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
    .brand { font-size: 1.3rem; font-weight: 800; color: #fff; line-height: 1.1; }
    
    .search-wrapper { flex: 1; max-width: 500px; }
    .search-input {
      width: 100%;
      background: #12121a;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }

    .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); object-fit: cover; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    /* Filter Tabs */
    .filter-section {
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .filter-section::-webkit-scrollbar { display: none; }
    .tabs { display: flex; gap: 8px; width: max-content; }
    .tab-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    .tab-btn.active { background: #fff; color: #000; border-color: #fff; }

    /* Feed */
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
    .card-thumb { width: 100%; height: 160px; object-fit: cover; background: #12121a; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
    .card-actions { margin-top: auto; display: flex; gap: 8px; }

    /* Bottom Navigation (YouTube style) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 40;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--muted);
      font-size: 0.75rem;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .nav-item.active { color: #fff; }
    .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }
    .upload-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
      margin-top: -10px;
    }

    button { cursor: pointer; font-family: inherit; }
    .btn { border: none; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }

    /* Modals */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; border: 1px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .close-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; background: #12121a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.95rem; }
    
    .divider { display: flex; align-items: center; text-align: center; color: var(--muted); font-size: 0.85rem; margin: 16px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--border); }
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }

    .btn-google { width: 100%; background: #fff; color: #000; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; font-size: 0.95rem; }
    .status-msg { margin-top: 12px; font-size: 0.9rem; color: var(--muted); min-height: 20px; }
    .toggle-password { position: absolute; right: 12px; top: 38px; background: none; border: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; }
    .relative { position: relative; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand-area">
      <div class="logo">🎮</div>
      <h1 class="brand">NAS Games</h1>
    </div>

    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="সার্চ করুন..." oninput="handleSearch()">
    </div>

    <div class="user-profile" id="userProfile" onclick="handleProfileClick()">
      <div class="avatar" id="avatarImg">👤</div>
    </div>
  </header>

  <div class="filter-section">
    <div class="tabs">
      <button class="tab-btn active" onclick="setFilter(this, 'all')">সব</button>
      <button class="tab-btn" onclick="setFilter(this, 'game')">গেম</button>
      <button class="tab-btn" onclick="setFilter(this, 'video')">ভিডিও / শর্টস</button>
    </div>
  </div>

  <main class="container">
    <div id="feedGrid" class="grid"></div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNavTab(this, 'home')">
      <span class="nav-icon">🏠</span>
      <span>হোম</span>
    </button>
    
    <button class="nav-item upload-fab" id="uploadFabBtn">+</button>

    <button class="nav-item" onclick="switchNavTab(this, 'shorts')">
      <span class="nav-icon">⚡</span>
      <span>শর্টস</span>
    </button>
  </nav>

  <!-- Auth Modal -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">সাইন-ইন করুন</h3>
        <button class="close-btn" onclick="toggleAuthModal(false)">✕</button>
      </div>

      <button class="btn-google" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#EA4335" d="M9 3.48c1.69 0 3.21.58 4.41 1.7L14.88 3.5C13.61 2.29 11.45 1.5 9 1.5 5.59 1.5 2.65 3.44 1.14 6.3l2.03 1.57C3.91 5.3 6.26 3.48 9 3.48z"/><path fill="#4285F4" d="M17.64 9.2c0-.62-.06-1.25-.19-1.8H9v3.51h4.88c-.21 1.15-.86 2.12-1.8 2.77l2.17 1.68c1.27-1.17 2.05-2.9 2.05-5.16z"/><path fill="#FBBC05" d="M4.17 11.04C3.8 9.94 3.8 8.76 4.17 7.66L2.14 6.09C.78 8.81.78 11.9 2.14 14.62l2.03-1.57z"/><path fill="#34A853" d="M9 16.5c2.43 0 4.6-.8 6.13-2.18l-2.17-1.68c-.75.5-1.71.8-3.96.8-2.74 0-5.09-1.82-5.91-4.39L1.06 9.87C2.56 12.73 5.5 16.5 9 16.5z"/></svg>
        Google দিয়ে চালিয়ে যান
      </button>

      <div class="divider">অথবা ইমেইল পাসওয়ার্ড</div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="field">
          <label>ইমেইল</label>
          <input type="email" id="authEmail" required placeholder="example@gmail.com">
        </div>
        <div class="field relative">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="authPassword" required placeholder="কমপক্ষে ৬ অক্ষর">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">চোখ</button>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="authSubmitBtn">প্রবেশ করুন</button>
      </form>

      <div class="status-msg" id="authStatusText"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-backdrop" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <h3>নতুন কন্টেন্ট</h3>
        <button class="close-btn" onclick="toggleUploadModal(false)">✕</button>
      </div>
      <form id="uploadForm" onsubmit="handleUploadSubmit(event)">
        <div class="field">
          <label>ধরন</label>
          <select id="contentType" onchange="updateUploadFields()">
            <option value="game">গেম</option>
            <option value="video">ভিডিও / শর্টস</option>
          </select>
        </div>
        <div class="field">
          <label>শিরোনাম</label>
          <input type="text" id="contentTitle" required>
        </div>
        <div class="field" id="gameUrlField">
          <label>গেমের লিংক</label>
          <input type="url" id="contentGameUrl" placeholder="https://...">
        </div>
        <div class="field hidden" id="videoFileField">
          <label>ভিডিও ফাইল</label>
          <input type="file" id="contentVideoFile" accept="video/*">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">আপলোড</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wcllhmpcorxruqqzyfda.supabase.co";
    const SUPABASE_ANON_KEY = "dummy_key";
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentUser = null;
    let authMode = 'login';
    let allItems = [];
    let currentFilter = 'all';
    let searchQuery = '';

    function togglePasswordVisibility() {
      const input = document.getElementById('authPassword');
      const btn = document.querySelector('.toggle-password');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'बंद';
      } else {
        input.type = 'password';
        btn.textContent = 'চোখ';
      }
    }

    function toggleAuthModal(show) {
      document.getElementById('authModal').classList.toggle('open', show);
    }

    function toggleUploadModal(show) {
      if (!currentUser) {
        alert('আপলোড করতে সাইন-ইন করুন।');
        toggleAuthModal(true);
        return;
      }
      document.getElementById('uploadModal').classList.toggle('open', show);
    }

    document.getElementById('uploadFabBtn').addEventListener('click', () => toggleUploadModal(true));

    function setFilter(btn, filterType) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = filterType;
      renderFeed();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      renderFeed();
    }

    function switchNavTab(btn, tabName) {
      document.querySelectorAll('.nav-item').forEach(b => {
        if (!b.classList.contains('upload-fab')) b.classList.remove('active');
      });
      if (!btn.classList.contains('upload-fab')) btn.classList.add('active');
      
      if (tabName === 'shorts') {
        currentFilter = 'video';
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.toggle('active', b.textContent.includes('ভিডিও'));
        });
      } else {
        currentFilter = 'all';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.contains('active') ? null : b.classList.remove('active'));
      }
      renderFeed();
    }

    function renderFeed() {
      const grid = document.getElementById('feedGrid');
      let list = allItems;
      
      if (currentFilter !== 'all') {
        list = list.filter(item => item.type === currentFilter);
      }
      if (searchQuery) {
        list = list.filter(item => item.title.toLowerCase().includes(searchQuery));
      }

      if (list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">কোনো কন্টেন্ট পাওয়া যায়নি।</p>`;
        return;
      }

      grid.innerHTML = list.map(item => `
        <div class="card">
          <img src="${item.thumb_url || 'https://via.placeholder.com/300x160'}" class="card-thumb" alt="">
          <div class="card-body">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-meta">${item.type === 'game' ? '🎮 গেম' : '⚡ ভিডিও'} • আপলোডার</div>
            <div class="card-actions">
              ${item.game_url ? `<a href="${item.game_url}" target="_blank" class="btn btn-primary" style="text-decoration:none; text-align:center; flex:1;">খেলুন</a>` : ''}
              ${item.video_url ? `<button class="btn btn-ghost" style="flex:1;">ভিডিও দেখুন</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function handleProfileClick() {
      if (currentUser) {
        if (confirm('লগআউট করতে চান?')) {
          currentUser = null;
          updateHeaderUI();
        }
      } else {
        toggleAuthModal(true);
      }
    }

    function updateHeaderUI() {
      const profile = document.getElementById('userProfile');
      if (currentUser) {
        profile.innerHTML = `<div class="avatar" style="background:var(--primary); color:#fff; font-weight:bold;">${currentUser.email[0].toUpperCase()}</div>`;
      } else {
        profile.innerHTML = `<div class="avatar">👤</div>`;
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      currentUser = { email: document.getElementById('authEmail').value };
      toggleAuthModal(false);
      updateHeaderUI();
      alert('সফলভাবে লগইন হয়েছে!');
    }

    document.getElementById('googleSignInBtn').addEventListener('click', () => {
      currentUser = { email: 'user@gmail.com' };
      toggleAuthModal(false);
      updateHeaderUI();
      alert('Google দিয়ে লগইন সফল!');
    });

    function updateUploadFields() {
      const type = document.getElementById('contentType').value;
      document.getElementById('gameUrlField').classList.toggle('hidden', type !== 'game');
      document.getElementById('videoFileField').classList.toggle('hidden', type !== 'video');
    }

    function handleUploadSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('contentTitle').value;
      const type = document.getElementById('contentType').value;
      allItems.unshift({
        id: Date.now(),
        title: title,
        type: type,
        thumb_url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500',
        game_url: type === 'game' ? document.getElementById('contentGameUrl').value : null,
        video_url: type === 'video' ? 'video.mp4' : null
      });
      toggleUploadModal(false);
      renderFeed();
      document.getElementById('uploadForm').reset();
    }

    // Initial dummy data
    allItems = [
      { id: 1, title: 'সুপার জাম্প অ্যাডভেঞ্চার', type: 'game', thumb_url: 'https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=500', game_url: 'https://google.com' },
      { id: 2, title: 'গেমের সেরা মুহূর্ত', type: 'video', thumb_url: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500', video_url: 'video.mp4' }
    ];
    renderFeed();
  </script>
</body>
</html>
