<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAS Games</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0b12;
      --card: #161624;
      --card-2: #1f1f33;
      --text: #ffffff;
      --muted: #a1a1bd;
      --accent: #a855f7;
      --accent-2: #ec4899;
      --success: #22c55e;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 11, 18, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--card-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      transition: transform 0.16s ease, opacity 0.2s ease, background 0.2s ease;
    }

    button:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 9px 14px;
    }

    .btn-ghost {
      background: var(--card-2);
      color: var(--text);
      padding: 8px 12px;
      border: 1px solid var(--border);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 8px 14px;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: var(--card-2);
      display: block;
    }

    .card-body { padding: 12px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .card-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      transform: translateY(22px) scale(0.97);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.show .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .auth-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card-2);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .auth-switch button {
      padding: 8px;
      background: transparent;
      color: var(--muted);
    }

    .auth-switch button.active {
      background: var(--card);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: #fff;
      outline: none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }

    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 80;
      background: var(--card-2);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">NAS Games</div>
    <div class="header-actions">
      <span id="modeBadge" class="badge">গেস্ট মোড</span>
      <button id="authOpenBtn" class="btn-primary">সাইন-ইন</button>
      <button id="uploadOpenBtn" class="btn-ghost">+ আপলোড</button>
      <button id="logoutBtn" class="btn-ghost hidden">লগআউট</button>
    </div>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" data-filter="all">সব</button>
      <button class="tab-btn" data-filter="game">গেম</button>
      <button class="tab-btn" data-filter="video">ভিডিও / শর্টস</button>
    </div>

    <div id="feedGrid" class="grid"></div>
  </main>

  <!-- Animated Auth Modal -->
  <div id="authModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authTitle">সাইন-ইন করুন</h3>
        <button class="btn-ghost" onclick="closeModal('authModal')">✕</button>
      </div>

      <div class="auth-switch">
        <button id="switchLogin" class="active" onclick="setAuthMode('login')">লগইন</button>
        <button id="switchSignup" onclick="setAuthMode('signup')">নতুন অ্যাকাউন্ট</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="authEmail">সত্যিকারের জিমেইল / ইমেইল</label>
          <input id="authEmail" type="email" required placeholder="example@gmail.com" />
        </div>
        <div class="field">
          <label for="authPassword">পাসওয়ার্ড</label>
          <input id="authPassword" type="password" required minlength="6" placeholder="কমপক্ষে ৬ অক্ষর" />
        </div>
        <button id="authSubmitBtn" type="submit" class="btn-primary" style="width:100%">
          প্রবেশ করুন
        </button>
        <p class="hint" id="authHint">
          নতুন অ্যাকাউন্ট খুললে আপনার জিমেইলে ভেরিফিকেশন লিংক পাঠানো হবে।
        </p>
      </form>
    </div>
  </div>

  <!-- Upload Modal (Game / Video + Optional User Gameplay Video) -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3>নতুন কন্টেন্ট আপলোড</h3>
        <button class="btn-ghost" onclick="closeModal('uploadModal')">✕</button>
      </div>

      <form id="uploadForm">
        <div class="field">
          <label for="contentType">কন্টেন্টের ধরন</label>
          <select id="contentType" onchange="toggleUploadFields()">
            <option value="game">গেম</option>
            <option value="video">ভিডিও / শর্টস</option>
          </select>
        </div>

        <div class="field">
          <label for="title">শিরোনাম / নাম</label>
          <input id="title" type="text" required placeholder="যেমন: Space Runner বা আমার শর্টস" />
        </div>

        <div class="field">
          <label for="thumbFile">থাম্বনেইল / কভার ছবি (ঐচ্ছিক)</label>
          <input id="thumbFile" type="file" accept="image/*" />
        </div>

        <div id="gameFields" class="field">
          <label for="gameUrl">গেম প্লে লিংক / URL</label>
          <input id="gameUrl" type="url" placeholder="https://..." />

          <div style="margin-top:12px;">
            <label for="gameplayFile">নিজস্ব গেমপ্লে ভিডিও (ঐচ্ছিক — চাইলে দিতে পারেন)</label>
            <input id="gameplayFile" type="file" accept="video/mp4,video/webm" />
            <p class="hint">কোনো অটো-গেমপ্লে তৈরি হবে না; চাইলে শুধু নিজের রেকর্ড করা গেমপ্লে যুক্ত করতে পারবেন。</p>
          </div>
        </div>

        <div id="videoFields" class="field hidden">
          <label for="videoFile">ভিডিও ফাইল (MP4 / WebM)</label>
          <input id="videoFile" type="file" accept="video/mp4,video/webm" />
        </div>

        <div class="field">
          <label for="description">বিবরণ (ঐচ্ছিক)</label>
          <textarea id="description" rows="2" placeholder="কন্টেন্ট সম্পর্কে সংক্ষেপে লিখুন..."></textarea>
        </div>

        <button id="uploadSubmitBtn" type="submit" class="btn-primary" style="width:100%">
          পাবলিশ করুন
        </button>
      </form>
    </div>
  </div>

  <!-- Player / Gameplay Preview Modal -->
  <div id="playerModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="playerTitle"></h3>
        <button class="btn-ghost" onclick="closeModal('playerModal')">✕</button>
      </div>
      <div id="playerBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let authMode = "login";
    let allItems = [];
    let currentFilter = "all";

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3000);
    }

    function openModal(id) {
      document.getElementById(id).classList.add("show");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById("switchLogin").classList.toggle("active", mode === "login");
      document.getElementById("switchSignup").classList.toggle("active", mode === "signup");
      document.getElementById("authTitle").textContent =
        mode === "login" ? "사인-ইন করুন" : "নতুন অ্যাকাউন্ট তৈরি করুন";
      document.getElementById("authSubmitBtn").textContent =
        mode === "login" ? "লগইন ও প্রবেশ করুন" : "সাইন-আপ ও ভেরিফাই করুন";
    }

    function updateAuthUI(user) {
      currentUser = user;
      const isLoggedIn = Boolean(user);
      document.getElementById("modeBadge").textContent =
        isLoggedIn ? user.email : "গেস্ট মোড";
      document.getElementById("authOpenBtn").classList.toggle("hidden", isLoggedIn);
      document.getElementById("logoutBtn").classList.toggle("hidden", !isLoggedIn);
    }

    document.getElementById("authOpenBtn").addEventListener("click", () => {
      setAuthMode("login");
      openModal("authModal");
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await sb.auth.signOut();
      showToast("লগআউট সম্পন্ন হয়েছে। এখন গেস্ট মোডে আছেন।");
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const btn = document.getElementById("authSubmitBtn");

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>যাচাই হচ্ছে...`;

      try {
        if (authMode === "signup") {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) {
            closeModal("authModal");
            showToast("অ্যাকাউন্ট তৈরি ও লগইন সফল হয়েছে!");
          } else {
            showToast("আপনার জিমেইলে ভেরিফিকেশন লিংক পাঠানো হয়েছে। ভেরিফাই করে লগইন করুন।");
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          closeModal("authModal");
          showToast("সফলভাবে লগইন হয়েছে! NAS Games-এ স্বাগতম।");
        }
      } catch (err) {
        showToast(err.message || "অথেন্টিকেশন ব্যর্থ হয়েছে।");
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === "login" ? "লগইন ও প্রবেশ করুন" : "사인-আপ ও ভেরিফাই করুন";
      }
    });

    // Guest mode can browse/play; upload strictly requires sign-in
    document.getElementById("uploadOpenBtn").addEventListener("click", () => {
      if (!currentUser) {
        showToast("কিছু আপলোড করতে আগে সত্যিকারের জিমেইল দিয়ে সাইন-ইন করুন।");
        setAuthMode("login");
        openModal("authModal");
        return;
      }
      openModal("uploadModal");
    });

    function toggleUploadFields() {
      const type = document.getElementById("contentType").value;
      document.getElementById("gameFields").classList.toggle("hidden", type !== "game");
      document.getElementById("videoFields").classList.toggle("hidden", type !== "video");
    }

    async function uploadToStorage(file, folder) {
      if (!file) return null;
      const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
      const path = `${folder}/${safeName}`;
      const { error } = await sb.storage.from("video").upload(path, file);
      if (error) throw error;
      const { data } = sb.storage.from("video").getPublicUrl(path);
      return data.publicUrl;
    }

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) {
        openModal("authModal");
        return;
      }

      const btn = document.getElementById("uploadSubmitBtn");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>আপলোড হচ্ছে...`;

      try {
        const type = document.getElementById("contentType").value;
        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();
        const thumbFile = document.getElementById("thumbFile").files[0] || null;
        const thumbUrl = await uploadToStorage(thumbFile, "thumbnails");

        let gameUrl = null;
        let videoUrl = null;

        if (type === "game") {
          gameUrl = document.getElementById("gameUrl").value.trim() || null;
          // Optional user gameplay video only (no auto gameplay generated)
          const gameplayFile = document.getElementById("gameplayFile").files[0] || null;
          if (gameplayFile) {
            videoUrl = await uploadToStorage(gameplayFile, "gameplay");
          }
        } else {
          const videoFile = document.getElementById("videoFile").files[0] || null;
          if (!videoFile) throw new Error("দয়া করে একটি ভিডিও ফাইল নির্বাচন করুন।");
          videoUrl = await uploadToStorage(videoFile, "shorts");
        }

        const { error } = await sb.from("NAS Games").insert([{
          title,
          type,
          description,
          thumb_url: thumbUrl,
          game_url: gameUrl,
          video_url: videoUrl,
          creator_email: currentUser.email,
          user_id: currentUser.id
        }]);

        if (error) throw error;

        document.getElementById("uploadForm").reset();
        toggleUploadFields();
        closeModal("uploadModal");
        showToast("সফলভাবে পাবলিশ হয়েছে!");
        await loadItems();
      } catch (err) {
        showToast(err.message || "আপলোড করতে সমস্যা হয়েছে।");
      } finally {
        btn.disabled = false;
        btn.textContent = "পাবলিশ করুন";
      }
    });

    async function loadItems() {
      const { data, error } = await sb
        .from("NAS Games")
        .select("*")
        .order("created_at", { ascending: false });

      if (!error && Array.isArray(data)) {
        allItems = data;
      }
      renderFeed();
    }

    function renderFeed() {
      const grid = document.getElementById("feedGrid");
      const list = currentFilter === "all"
        ? allItems
        : allItems.filter((x) => x.type === currentFilter);

      if (!list.length) {
        grid.innerHTML = `<p class="hint">এখনো কোনো কন্টেন্ট নেই।</p>`;
        return;
      }

      grid.innerHTML = list.map((item, idx) => `
        <div class="card" style="animation-delay:${idx * 0.04}s">
          <img class="card-thumb" src="${item.thumb_url || "https://via.placeholder.com/400x200/1f1f33/a1a1bd?text=NAS+Games"}" alt="" />
          <div class="card-body">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-meta">
              ${item.type === "game" ? "গেম" : "ভিডিও"} • ${escapeHtml(item.creator_email || "ক্রিয়েটর")}
            </div>
            <div class="card-actions">
              ${item.game_url ? `<a href="${escapeAttr(item.game_url)}" target="_blank" class="btn-primary" style="text-decoration:none;font-size:0.85rem;">খেলুন</a>` : ""}
              ${item.video_url ? `<button class="btn-ghost" style="font-size:0.85rem;" onclick="openVideo('${escapeAttr(item.title)}', '${escapeAttr(item.video_url)}', '${escapeAttr(item.description || "")}')">${item.type === "game" ? "গেমপ্লে দেখুন" : "ভিডিও দেখুন"}</button>` : ""}
            </div>
          </div>
        </div>
      `).join("");
    }

    function openVideo(title, url, desc) {
      document.getElementById("playerTitle").textContent = title;
      document.getElementById("playerBody").innerHTML = `
        <video src="${escapeAttr(url)}" controls autoplay style="width:100%;border-radius:12px;background:#000;"></video>
        ${desc ? `<p class="hint" style="margin-top:10px;font-size:0.9rem;">${escapeHtml(desc)}</p>` : ""}
      `;
      openModal("playerModal");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": '&gt;', '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderFeed();
      });
    });

    sb.auth.getSession().then(({ data }) => {
      updateAuthUI(data.session?.user || null);
      loadItems();
    });

    sb.auth.onAuthStateChange((_event, session) => {
      updateAuthUI(session?.user || null);
    });
  </script>
</body>
</html>
